<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Twitch Image Overlay (URL Only)</title>
    <style>
        /* 背景を透明にし、スクロールバーを隠す */
        body {
            margin: 0;
            overflow: hidden;
            background: transparent;
        }
        #stage {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        /* 画像表示コンテナ */
        #image-overlay {
            display: none; /* 初期状態は非表示 */
            text-align: center;
            z-index: 1000;
        }
        /* 表示される画像の設定 */
        #target-image {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8), 0 0 15px rgba(145, 70, 255, 0.6);
            border: 4px solid #9146FF;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* ふわっと拡大して表示されるアニメーション */
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div id="stage">
        <div id="image-overlay">
            <img id="target-image" src="" alt="">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/comfy.js@latest/dist/comfy.min.js"></script>
    <script>
        // ==================================================
        //  設定項目（カスタマイズ用パラメータ）
        // ==================================================
        const CONFIG = {
            // 画像を表示しておく時間（ミリ秒単位。10000 = 10秒）
            displayTime: 90000,
            
            // チャットで実行するコマンド名（例: "img" の場合、チャットで !img と入力）
            commandName: "img",
            
            // 消える時のフェードアウトにかける時間（ミリ秒単位。1500 = 1.5秒）
            fadeOutTime: 1500
        };
        // ==================================================

        // URLパラメータからチャンネル名を取得 (?channel=チャンネル名)
        const params = new URLSearchParams(window.location.search);
        const channel = params.get('channel');
        
        if (channel) {
            ComfyJS.Init(channel);
        } else {
            alert("URLの末尾に ?channel=あなたのチャンネル名 を付けてください");
        }

        let displayTimeout = null;

        // コマンド受信時の処理
        ComfyJS.onCommand = (user, command, message, flags) => {
            // 配信者(broadcaster)またはモデレーター(mod)のみ許可
            const isAdmin = flags.broadcaster || flags.mod;

            // 設定したコマンド名と一致し、管理者の場合のみ実行
            if (command === CONFIG.commandName && isAdmin) {
                // message（引数）から前後の余分な空白を除去し、すべてURLとして扱う
                const imageUrl = message.trim();
                if (imageUrl) {
                    showImageOverlay(imageUrl);
                }
            }
        };

        function showImageOverlay(url) {
            const overlay = document.getElementById('image-overlay');
            const img = document.getElementById('target-image');

            // 既存のタイマー（表示中の画像）があれば強制キャンセルして上書き
            if (displayTimeout) clearTimeout(displayTimeout);

            // 画像のURLをセット
            img.src = url;
            
            // 表示開始（フェードのスタイルを初期化）
            overlay.style.display = 'block';
            overlay.style.transition = "none";
            overlay.style.opacity = "1";

            // 設定された表示時間が経過したらフェードアウトを開始
            displayTimeout = setTimeout(() => {
                overlay.style.transition = `opacity ${CONFIG.fadeOutTime / 1000}s`;
                overlay.style.opacity = "0";
                
                // フェードアウトアニメーション完了後に非表示にしてリソース解放
                setTimeout(() => {
                    overlay.style.display = 'none';
                    img.src = ""; 
                }, CONFIG.fadeOutTime);
            }, CONFIG.displayTime);
        }
    </script>
</body>
</html>
