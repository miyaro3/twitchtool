<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twitch Score Manager</title>
<script src="https://cdn.jsdelivr.net/npm/comfy.js@latest/dist/comfy.min.js"></script>
<style>
  :root {
    --bg: #121216;
    --panel: #1e1e26;
    --border: #2e2e3a;
    --text: #efeff1;
    --muted: #9a9aa6;
    --accent: #9146ff;
    --accent-hover: #772ce8;
    --success: #00c853;
    --danger: #ff4b2b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    justify-content: space-between;
  }
  .header-left, .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  h1 {
    font-size: 1.1rem;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge {
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 4px;
    background: #2c2c38;
    color: var(--muted);
  }
  .badge.connected {
    background: rgba(0, 200, 83, 0.15);
    color: var(--success);
  }
  .point-settings {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #16161d;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 0.85rem;
  }
  .point-settings input {
    width: 58px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 6px;
    border-radius: 4px;
    text-align: center;
    font-weight: bold;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    transition: background 0.15s, opacity 0.15s;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary { background: #2f2f3d; }
  button.secondary:hover { background: #3e3e50; }
  button.danger { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 4px 8px; }
  button.danger:hover { color: var(--danger); border-color: var(--danger); }

  .file-status {
    font-size: 0.8rem;
    color: var(--muted);
  }
  .file-status.active {
    color: var(--success);
    font-weight: 600;
  }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 16px;
    padding: 16px 20px;
    overflow: hidden;
  }
  .column {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .column-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-weight: bold;
    font-size: 0.95rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .list-container {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* 左側：スコア管理カード */
  .score-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #16161d;
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: 6px;
  }
  .user-info {
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
    flex: 1;
  }
  .user-name {
    font-weight: bold;
    font-size: 0.95rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .user-score {
    font-size: 1.05rem;
    font-weight: 700;
    color: #bf94ff;
    white-space: nowrap;
  }
  .btn-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .pt-btn {
    min-width: 52px;
    padding: 6px 10px;
    font-size: 0.85rem;
  }
  .pt-btn:nth-child(1) { background: #2b59c3; }
  .pt-btn:nth-child(1):hover { background: #21469c; }
  .pt-btn:nth-child(2) { background: #772ce8; }
  .pt-btn:nth-child(2):hover { background: #5e1ec2; }
  .pt-btn:nth-child(3) { background: #00897b; }
  .pt-btn:nth-child(3):hover { background: #00695c; }

  /* 右側：コメントユーザー一覧 */
  .chat-user-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 14px;
    background: #16161d;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .chat-user-item:hover:not(.added) {
    border-color: var(--accent);
    background: #20202b;
  }
  .chat-user-item.added {
    opacity: 0.45;
    cursor: default;
  }
  .chat-user-meta {
    font-size: 0.75rem;
    color: var(--muted);
  }
  .empty-hint {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 32px;
  }

  /* チャンネル入力オーバーレイ */
  .channel-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 14, 0.88);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    padding: 20px;
  }
  .channel-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
  }
  .channel-card h2 {
    margin: 0 0 10px;
    font-size: 1.2rem;
  }
  .channel-card p {
    margin: 0 0 20px;
    font-size: 0.88rem;
    color: var(--muted);
    line-height: 1.5;
  }
  .channel-form {
    display: flex;
    gap: 8px;
  }
  .channel-form input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #121216;
    color: var(--text);
    font-size: 0.95rem;
  }
  .channel-form input:focus {
    outline: none;
    border-color: var(--accent);
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Twitch Score Manager <span id="connStatus" class="badge">未接続</span></h1>
    <div class="point-settings">
      <span>加算ボタン設定:</span>
      <label>① <input type="number" id="ptVal0" value="1"></label>
      <label>② <input type="number" id="ptVal1" value="3"></label>
      <label>③ <input type="number" id="ptVal2" value="5"></label>
    </div>
  </div>
  <div class="header-right">
    <span id="fileStatus" class="file-status">保存先: 未指定</span>
    <button id="selectFileBtn">保存先ファイルを選択</button>
    <button id="manualSaveBtn" class="secondary" title="現在の内容で強制上書き">手動保存</button>
  </div>
</header>

<main>
  <!-- 左側：スコア管理（画面は追加順、ファイル出力はポイント降順） -->
  <section class="column">
    <div class="column-header">
      <span>スコア管理リスト（追加順 / ファイル出力は降順）</span>
      <button id="resetAllScoresBtn" class="danger">全員0ptに戻す</button>
    </div>
    <div id="managedList" class="list-container">
      <div class="empty-hint">右側のコメントユーザーをクリックすると追加されます</div>
    </div>
  </section>

  <!-- 右側：コメントユーザー一覧 -->
  <section class="column">
    <div class="column-header">
      <span>コメントユーザー一覧（重複排除）</span>
      <span id="chatUserCount" class="badge">0人</span>
    </div>
    <div id="chatUserList" class="list-container">
      <div class="empty-hint">コメント受信待機中...</div>
    </div>
  </section>
</main>

<script>
/* --- Twitch連携・初期化セクション --- */
const params = new URLSearchParams(window.location.search);
const channel = params.get('channel')?.trim();

if (channel) {
  ComfyJS.Init(channel);
  console.log(`Connected to channel: ${channel}`);
  const statusEl = document.getElementById('connStatus');
  statusEl.textContent = `#${channel}`;
  statusEl.classList.add('connected');
} else {
  showChannelPromptOverlay();
}

function showChannelPromptOverlay() {
  const overlay = document.createElement('div');
  overlay.className = 'channel-overlay';
  overlay.innerHTML = `
    <div class="channel-card">
      <h2>Twitch チャンネル名を入力</h2>
      <p>URLパラメータ <code>?channel=</code> が指定されていません。<br>接続するチャンネル名を入力するとパラメータ付きURLへ移動します。</p>
      <form class="channel-form" id="channelForm">
        <input type="text" id="channelInput" placeholder="例: twitch_user_id" autocomplete="off" required>
        <button type="submit">移動</button>
      </form>
    </div>
  `;
  document.body.appendChild(overlay);

  const inputEl = document.getElementById('channelInput');
  const formEl = document.getElementById('channelForm');
  inputEl.focus();

  formEl.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = inputEl.value.trim().replace(/^#/, '');
    if (!val) return;
    const nextUrl = new URL(window.location.href);
    nextUrl.searchParams.set('channel', val);
    window.location.href = nextUrl.toString();
  });
}

/* --- 状態管理 --- */
// 右側：コメ欄ユーザー { id: lowerName, name: displayName, lastMsg: string }
const chatUsers = new Map();
// 左側：管理対象ユーザー（Mapの挿入順＝追加順をそのまま保持）
const managedUsers = new Map();
let addSequence = 0;

// 加算ボタンの値（localStorageと同期）
const STORAGE_KEY_BTNS = 'twitch_score_btn_values';
let buttonValues = [1, 3, 5];
try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY_BTNS));
  if (Array.isArray(saved) && saved.length === 3) {
    buttonValues = saved.map(n => Number(n) || 0);
  }
} catch (_) {}

// File System Access API ハンドル
let fileHandle = null;

/* --- DOM要素 --- */
const ptInputs = [
  document.getElementById('ptVal0'),
  document.getElementById('ptVal1'),
  document.getElementById('ptVal2')
];
const managedListEl = document.getElementById('managedList');
const chatUserListEl = document.getElementById('chatUserList');
const chatUserCountEl = document.getElementById('chatUserCount');
const fileStatusEl = document.getElementById('fileStatus');

/* --- ポイント設定入力の初期化とイベント --- */
ptInputs.forEach((input, idx) => {
  input.value = buttonValues[idx];
  input.addEventListener('input', () => {
    const val = parseInt(input.value, 10);
    buttonValues[idx] = isNaN(val) ? 0 : val;
    localStorage.setItem(STORAGE_KEY_BTNS, JSON.stringify(buttonValues));
    renderManagedList();
  });
});

/* --- ファイル選択・上書き保存処理 --- */
document.getElementById('selectFileBtn').addEventListener('click', async () => {
  if (!('showSaveFilePicker' in window)) {
    alert('このブラウザは File System Access API に対応していません。Chrome または Edge をご利用ください。');
    return;
  }
  try {
    fileHandle = await window.showSaveFilePicker({
      suggestedName: 'score.txt',
      types: [{
        description: 'テキストファイル',
        accept: { 'text/plain': ['.txt'] }
      }]
    });
    fileStatusEl.textContent = `保存先: ${fileHandle.name}`;
    fileStatusEl.classList.add('active');
    await saveScoresToFile();
  } catch (err) {
    if (err.name !== 'AbortError') {
      console.error('ファイル選択エラー:', err);
      alert('ファイルの選択に失敗しました。');
    }
  }
});

document.getElementById('manualSaveBtn').addEventListener('click', async () => {
  if (!fileHandle) {
    alert('先に「保存先ファイルを選択」からテキストファイルを指定してください。');
    return;
  }
  await saveScoresToFile();
});

// ファイル出力用：ポイント降順（同点は追加順）
function getSortedForFileOutput() {
  return Array.from(managedUsers.values()).sort((a, b) => {
    if (b.score !== a.score) return b.score - a.score;
    return a.order - b.order;
  });
}

async function saveScoresToFile() {
  if (!fileHandle) return;
  try {
    const sorted = getSortedForFileOutput();
    const lines = sorted.map(u => `${u.name}：${u.score}`);
    const content = lines.join('\r\n');

    const writable = await fileHandle.createWritable();
    await writable.write(content);
    await writable.close();
  } catch (err) {
    console.error('ファイル書き込みエラー:', err);
    fileStatusEl.textContent = `保存エラー（再選択してください）`;
    fileStatusEl.classList.remove('active');
  }
}

/* --- Twitchチャット受信（重複排除） --- */
function handleIncomingUser(user, message) {
  if (!user) return;
  const id = user.toLowerCase();
  chatUsers.set(id, {
    id,
    name: user,
    lastMsg: message || ''
  });
  renderChatUsers();
}

ComfyJS.onChat = (user, message, flags, self, extra) => {
  handleIncomingUser(user, message);
};

ComfyJS.onCommand = (user, command, message, flags, extra) => {
  handleIncomingUser(user, `!${command} ${message}`.trim());
};

/* --- 右側：コメントユーザー一覧描画 --- */
function renderChatUsers() {
  chatUserCountEl.textContent = `${chatUsers.size}人`;
  if (chatUsers.size === 0) return;

  chatUserListEl.innerHTML = '';
  const users = Array.from(chatUsers.values()).reverse();

  users.forEach(u => {
    const isAdded = managedUsers.has(u.id);
    const item = document.createElement('div');
    item.className = 'chat-user-item' + (isAdded ? ' added' : '');

    const nameSpan = document.createElement('span');
    nameSpan.className = 'user-name';
    nameSpan.textContent = u.name;

    const metaSpan = document.createElement('span');
    metaSpan.className = 'chat-user-meta';
    metaSpan.textContent = isAdded ? '追加済' : 'クリックで追加';

    item.appendChild(nameSpan);
    item.appendChild(metaSpan);

    item.addEventListener('click', () => {
      if (managedUsers.has(u.id)) return;
      managedUsers.set(u.id, {
        id: u.id,
        name: u.name,
        score: 0,
        order: addSequence++
      });
      renderChatUsers();
      renderManagedList();
      saveScoresToFile();
    });

    chatUserListEl.appendChild(item);
  });
}

/* --- 左側：スコア管理リスト描画（追加順で固定） --- */
function formatBtnLabel(val) {
  return val >= 0 ? `+${val}` : `${val}`;
}

function renderManagedList() {
  if (managedUsers.size === 0) {
    managedListEl.innerHTML = '<div class="empty-hint">右側のコメントユーザーをクリックすると追加されます</div>';
    return;
  }

  managedListEl.innerHTML = '';
  managedUsers.forEach(u => {
    const row = document.createElement('div');
    row.className = 'score-row';

    const info = document.createElement('div');
    info.className = 'user-info';

    const nameEl = document.createElement('span');
    nameEl.className = 'user-name';
    nameEl.textContent = u.name;

    const scoreEl = document.createElement('span');
    scoreEl.className = 'user-score';
    scoreEl.textContent = `${u.score} pt`;

    info.appendChild(nameEl);
    info.appendChild(scoreEl);

    const btnGroup = document.createElement('div');
    btnGroup.className = 'btn-group';

    buttonValues.forEach(val => {
      const btn = document.createElement('button');
      btn.className = 'pt-btn';
      btn.textContent = formatBtnLabel(val);
      btn.addEventListener('click', async () => {
        u.score += val;
        scoreEl.textContent = `${u.score} pt`;
        await saveScoresToFile();
      });
      btnGroup.appendChild(btn);
    });

    const delBtn = document.createElement('button');
    delBtn.className = 'danger';
    delBtn.textContent = '×';
    delBtn.title = 'リストから削除';
    delBtn.addEventListener('click', async () => {
      managedUsers.delete(u.id);
      renderChatUsers();
      renderManagedList();
      await saveScoresToFile();
    });
    btnGroup.appendChild(delBtn);

    row.appendChild(info);
    row.appendChild(btnGroup);
    managedListEl.appendChild(row);
  });
}

/* --- 全員リセット --- */
document.getElementById('resetAllScoresBtn').addEventListener('click', async () => {
  if (managedUsers.size === 0) return;
  if (!confirm('管理リスト全員のポイントを 0 にリセットしますか？')) return;
  managedUsers.forEach(u => { u.score = 0; });
  renderManagedList();
  await saveScoresToFile();
});
</script>
</body>
</html>
